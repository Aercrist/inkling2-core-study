  - id: tokenspeed_b300_attn_kernel
    value: [10.3, 14.6, 36.7]
    unit: microseconds for one full-attention decode launch at 8K / 32K / 128K keys
    hardware: B300 (per rank at TP4)
    engine: TokenSpeed
    workload: one request, 8 query rows, 12 query heads over 2 KV heads, head dim 128, 24 splits
    src: tokenspeed-src
    quote: "at one request, 24 splits take 10.3 / 14.6 / 36.7 us at 8K / 32K / 128K keys"

# Published facts that constrain the KV-cache model (not speeds).
kv_facts:
  - id: tokenspeed_kv_bytes_per_rank
    value: 528
    unit: bytes per token per target full-attention layer, per rank at TP4, MXFP8 KV
    src: tokenspeed-blog
    quote: "full-attention history in 128-token pages that grow with the context at 528 bytes per token per target layer"
  - id: tokenspeed_kv_ratio_mxfp8
    value: 0.70
    unit: MXFP8-KV bytes per token / BF16-KV bytes per token (target MXFP8, draft stays BF16)
    src: tokenspeed-recipe
    quote: "A token takes 0.70 of its BF16 cache bytes, so four B300 GPUs hold 15.8M tokens instead of 10.9M."
  - id: vllm_kv_1m_request
    value: 64.47
    unit: GiB of KV cache for one request at 1,048,576 tokens
    src: vllm-recipe
    quote: "To serve at least one request with the model's max seq len (1048576), (64.47 GiB KV cache is needed"
