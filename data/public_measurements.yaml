# Published, measured serving figures for Inkling 2 Small on disclosed hardware.
# Every entry is "measured (source)": we quote it, we did not run it. Pages read 2026-11-14.
# Keys in `src` resolve in docs/sources.md. The GPU model (G0) is calibrated to these (sim/calibrate_gpu.py).

measurements:
  - id: tokenspeed_b300_c1_dspark
    value: 476
    unit: tok/s per user (decode, median across requests)
    hardware: 4x B300
    layout: TP4 + EP4
    engine: TokenSpeed
    speculation: DSpark
    kv_cache: MXFP8
    concurrency: 1
    workload: AgentX agentic coding sessions replayed; prompts average 94k tokens, 94% prefix-cache hits; replies average 866 tokens
    src: tokenspeed-blog
    quote: "DSPARK makes per-user decode 75% faster than the target model alone at concurrency 1 (476 versus 272 tokens per second)"

  - id: tokenspeed_b300_c1_target_only
    value: 272
    unit: tok/s per user (decode, median across requests)
    hardware: 4x B300
    layout: TP4 + EP4
    engine: TokenSpeed
    speculation: none
    concurrency: 1
    workload: same as tokenspeed_b300_c1_dspark
    src: tokenspeed-blog
    quote: "476 versus 272 tokens per second"

  - id: tokenspeed_b300_c8_dspark
